# Docker Compose for SULLIVAN - Media & Intensive Services
# Powerful server handling media, downloads, AI, and user applications

# =============================================================================
# YAML ANCHORS - Reusable configuration blocks
# =============================================================================
x-common-env: &common-env
  TZ: ${TZ:-America/Toronto}
  PUID: ${PUID:-1001}
  PGID: ${PGID:-1001}

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-healthcheck-defaults: &healthcheck-defaults
  interval: 30s
  timeout: 10s
  retries: 3

x-nvidia-deploy: &nvidia-deploy
  resources:
    reservations:
      devices:
        - driver: nvidia
          count: all
          capabilities: [compute, utility, video]

x-media-volumes-rw: &media-volumes-rw
  - ${MEDIA_PATH_MOVIES:-/mnt/media/movies}:/movies:rw
  - ${MEDIA_PATH_SHOWS:-/mnt/media/shows}:/shows:rw
  - ${MEDIA_PATH_MUSIC:-/mnt/media/music}:/music:rw
  - ${MEDIA_PATH_MUSIC_VIDEOS:-/mnt/media/music_videos}:/music_videos:rw
  - ${MEDIA_PATH_EDU:-/mnt/media/edu}:/edu:rw

# Named volumes for data/cache/databases only
volumes:
  # Media Service volumes
  emby_data:
  emby_cache:
  emby_backup:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${BACKUP_DESTINATION:-/mnt/media/backup/emby}
  jellyfin_data:
  jellyfin_cache:
  plex_data:
  plex_cache:

  # Download Management volumes
  sonarr_data:
  radarr_data:
  lidarr_data:
  prowlarr_data:
  qbittorrent_data:
  bazarr_data:

  # Utility volumes
  filebot_data:
  duplicati_data:
  ytdl_data:
  mealie_data:
  grocy_data:
  wiki_data:
  seerr_data:
  tdarr_server_data:
  tdarr_configs:
  recyclarr_data:

  # Database volumes
  ytdl_mongodb:
  wiki_postgres:

  # Dispatcharr
  dispatcharr_data:

# Custom networks for service isolation
networks:
  frontend:
    driver: bridge
  media:
    driver: bridge
  download:
    driver: bridge
  database:
    driver: bridge
  monitoring:
    driver: bridge
  utilities:
    driver: bridge

services:
  # =============================================================================
  # MEDIA SERVICES
  # =============================================================================

  # emby - primary media server for movies, TV shows, and live TV
  emby:
    image: emby/embyserver
    container_name: emby
    security_opt:
      - apparmor:unconfined
    #runtime: nvidia
    #deploy:
    #    <<: *nvidia-deploy
    #    resources:
    #        limits:
    #            memory: 4G
    #        reservations:
    #            devices:
    #                - driver: nvidia
    #                  count: all
    #                  capabilities: [compute, utility, video]
    environment:
      <<: *common-env
      LIBVA_DRIVER_NAME: ${LIBVA_DRIVER_NAME:-iHD}
    volumes:
      # DATA: Database, metadata, cache
      - emby_data:/config
      - emby_cache:/cache
      # TRANSCODE: Temporary
      - /tmp:/transcode
      # MEDIA: media files (read-write for live TV recordings)
      - ${MEDIA_PATH_MOVIES:-/mnt/media/movies}:/movies
      - ${MEDIA_PATH_SHOWS:-/mnt/media/shows}:/shows
      - ${MEDIA_PATH_MUSIC:-/mnt/media/music}:/music
      - ${MEDIA_PATH_MUSIC_VIDEOS:-/mnt/media/music_videos}:/music_videos
      - ${MEDIA_PATH_EDU:-/mnt/media/edu}:/edu
      # BACKUP: For backups
      - emby_backup:/backup
    devices:
      - /dev/dri:/dev/dri
    ports:
      - "8096:8096"
      - "8920:8920"
    restart: always
    logging: *default-logging
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8096/health"]
      <<: *healthcheck-defaults
      start_period: 90s
    networks:
      - media

  # jellyfin
  jellyfin:
    image: lscr.io/linuxserver/jellyfin:latest
    container_name: jellyfin
    #runtime: nvidia
    #deploy:
    #    <<: *nvidia-deploy
    #    resources:
    #        limits:
    #            memory: 3G
    #        reservations:
    #            devices:
    #                - driver: nvidia
    #                  count: all
    #                  capabilities: [compute, utility, video]
    environment:
      <<: *common-env
      LIBVA_DRIVER_NAME: ${LIBVA_DRIVER_NAME:-iHD}
    volumes:
      # DATA: Database, metadata, cache
      - jellyfin_data:/config
      - jellyfin_cache:/cache
      # TRANSCODE: Temporary
      - /tmp:/transcode
      # MEDIA: Read-write media files for full media management
      - ${MEDIA_PATH_MOVIES:-/mnt/media/movies}:/movies:rw
      - ${MEDIA_PATH_SHOWS:-/mnt/media/shows}:/shows:rw
      - ${MEDIA_PATH_MUSIC:-/mnt/media/music}:/music:rw
      - ${MEDIA_PATH_MUSIC_VIDEOS:-/mnt/media/music_videos}:/music_videos:rw
      - ${MEDIA_PATH_EDU:-/mnt/media/edu}:/edu:rw
    devices:
      - /dev/dri:/dev/dri
    ports:
      - "8097:8096"
    restart: always
    logging: *default-logging
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8096/health"]
      <<: *healthcheck-defaults
      start_period: 90s
    networks:
      - media

  # plex - music streaming (Plexamp) + lifetime Plex Pass
  plex:
    image: lscr.io/linuxserver/plex:latest
    container_name: plex
    #runtime: nvidia
    #deploy:
    #    <<: *nvidia-deploy
    #    resources:
    #        limits:
    #            memory: 4G
    #        reservations:
    #            devices:
    #                - driver: nvidia
    #                  count: all
    #                  capabilities: [compute, utility, video]
    environment:
      <<: *common-env
      VERSION: docker
      LIBVA_DRIVER_NAME: ${LIBVA_DRIVER_NAME:-iHD}
      PLEX_CLAIM: claim-zTtSxcWvxoUzxPD5FC1V
    volumes:
      # DATA: Database, metadata, cache
      - plex_data:/config
      - plex_cache:/cache
      # TRANSCODE: Temporary
      - /tmp:/transcode
      # MEDIA: Read-write media files for full media management
      - ${MEDIA_PATH_MOVIES:-/mnt/media/movies}:/movies:rw
      - ${MEDIA_PATH_SHOWS:-/mnt/media/shows}:/shows:rw
      - ${MEDIA_PATH_MUSIC:-/mnt/media/music}:/music:rw
      - ${MEDIA_PATH_MUSIC_VIDEOS:-/mnt/media/music_videos}:/music_videos:rw
      - ${MEDIA_PATH_EDU:-/mnt/media/edu}:/edu:rw
    devices:
      - /dev/dri:/dev/dri
    ports:
      - "32400:32400"
      - "1900:1900"
      - "5353:5353"
      - "32410:32410"
      - "32412:32412"
      - "32413:32413"
      - "32414:32414"
      - "32469:32469"
    restart: always
    logging: *default-logging
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:32400/identity"]
      <<: *healthcheck-defaults
      start_period: 90s
    networks:
      - media

  # =============================================================================
  # DOWNLOAD MANAGEMENT
  # =============================================================================

  # qbittorrent
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    environment:
      <<: *common-env
      WEBUI_PORT: 8080
    volumes:
      # DATA: Application data and cache
      - qbittorrent_data:/config
      # DOWNLOADS: OS drive for fast I/O (*arr apps move to /mnt/media after processing)
      - ${DOWNLOAD_PATH_INCOMPLETE:-/media/qbittorrent/incomplete}:/incomplete
      - ${DOWNLOAD_PATH_COMPLETE:-/media/qbittorrent/complete}:/complete
      - ${DOWNLOAD_PATH_TORRENT:-/media/qbittorrent/torrent}:/torrent
      - ${DOWNLOAD_PATH_MONITOR:-/media/qbittorrent/monitor}:/monitor
      # MEDIA: For seeding and *arr access to final destinations
      - ${MEDIA_PATH_SEED:-/mnt/media/seed}:/seed
      - ${MEDIA_PATH:-/mnt/media}:/media
      - ${MEDIA_PATH_EDU:-/mnt/media/edu}:/edu
      - ${MEDIA_PATH_AUDIOBOOKS:-/mnt/media/books/audiobooks}:/audiobooks
      - ${MEDIA_PATH_EBOOKS:-/mnt/media/books/ebooks}:/ebooks
    ports:
      - "8080:8080"
      - "60000:60000"
    restart: always
    logging: *default-logging
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080"]
      <<: *healthcheck-defaults
      start_period: 60s
    networks:
      - download
    deploy:
      resources:
        limits:
          memory: 2G

  # prowlarr - indexer manager (replaces Jackett)
  # Native *arr integration - syncs indexers to Sonarr/Radarr/Lidarr automatically
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    environment:
      <<: *common-env
    volumes:
      - prowlarr_data:/config
    ports:
      - "9696:9696"
    restart: always
    logging: *default-logging
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9696/ping"]
      <<: *healthcheck-defaults
      start_period: 40s
    networks:
      - download
    deploy:
      resources:
        limits:
          memory: 512M

  # flaresolverr
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    environment:
      TZ: ${TZ:-America/Toronto}
      LOG_LEVEL: ${FLARESOLVERR_LOG_LEVEL:-info}
      LOG_HTML: ${FLARESOLVERR_LOG_HTML:-false}
      CAPTCHA_SOLVER: ${FLARESOLVERR_CAPTCHA_SOLVER:-none}
    ports:
      - "${FLARESOLVERR_PORT:-8191}:8191"
    restart: always
    logging: *default-logging
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8191/health"]
      <<: *healthcheck-defaults
      start_period: 30s
    networks:
      - download
    deploy:
      resources:
        limits:
          memory: 1G

  # sonarr - TV series management
  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    environment:
      <<: *common-env
    volumes:
      # DATA: Database and logs
      - sonarr_data:/config
      # DOWNLOADS: For import
      - ${DOWNLOAD_PATH_COMPLETE:-/mnt/media/qbittorrent/complete}:/complete
      # MEDIA: TV shows directory
      - ${MEDIA_PATH_SHOWS:-/mnt/media/shows}:/shows
      - ${MEDIA_PATH:-/mnt/media}:/media
      - ${MEDIA_PATH_SHOWS_ALT:-/mnt/media/shows}:/sullivan
    ports:
      - "8989:8989"
    restart: always
    logging: *default-logging
    depends_on:
      - qbittorrent
      - prowlarr
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8989/ping"]
      <<: *healthcheck-defaults
      start_period: 60s
    networks:
      - download
    deploy:
      resources:
        limits:
          memory: 1G

  # radarr - movie management
  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    environment:
      <<: *common-env
    volumes:
      # DATA: Database and logs
      - radarr_data:/config
      # DOWNLOADS: For import
      - ${DOWNLOAD_PATH_COMPLETE:-/mnt/media/qbittorrent/complete}:/complete
      # MEDIA: Movies directory
      - ${MEDIA_PATH_MOVIES:-/mnt/media/movies}:/movies
      - ${MEDIA_PATH:-/mnt/media}:/media
      - ${MEDIA_PATH_MOVIES_ALT:-/mnt/media/movies}:/sullivan
    ports:
      - "7878:7878"
    restart: always
    logging: *default-logging
    depends_on:
      - qbittorrent
      - prowlarr
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7878/ping"]
      <<: *healthcheck-defaults
      start_period: 60s
    networks:
      - download
    deploy:
      resources:
        limits:
          memory: 1G

  # lidarr - music management
  lidarr:
    image: lscr.io/linuxserver/lidarr:latest
    container_name: lidarr
    environment:
      <<: *common-env
    volumes:
      # DATA: Database and logs
      - lidarr_data:/config
      # DOWNLOADS: For import
      - ${DOWNLOAD_PATH_COMPLETE:-/mnt/media/qbittorrent/complete}:/complete
      # MEDIA: Music directory
      - ${MEDIA_PATH_MUSIC:-/mnt/media/music}:/music
      - ${MEDIA_PATH:-/mnt/media}:/media
    ports:
      - "8686:8686"
    restart: always
    logging: *default-logging
    depends_on:
      - qbittorrent
      - prowlarr
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8686/ping"]
      <<: *healthcheck-defaults
      start_period: 60s
    networks:
      - download
    deploy:
      resources:
        limits:
          memory: 1G

  # bazarr - automated subtitle downloads
  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    environment:
      <<: *common-env
    volumes:
      - bazarr_data:/config
      - ${MEDIA_PATH_MOVIES:-/mnt/media/movies}:/movies
      - ${MEDIA_PATH_SHOWS:-/mnt/media/shows}:/shows
    ports:
      - "6767:6767"
    restart: always
    logging: *default-logging
    depends_on:
      - sonarr
      - radarr
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6767/ping"]
      <<: *healthcheck-defaults
      start_period: 40s
    networks:
      - download
    deploy:
      resources:
        limits:
          memory: 512M

  # unpackerr
  unpackerr:
    image: golift/unpackerr
    container_name: unpackerr
    volumes:
      # DOWNLOADS: Working directories
      - ${MEDIA_PATH:-/mnt/media}:/media
      - ${DOWNLOAD_PATH_COMPLETE:-/mnt/media/qbittorrent/complete}:/complete
    user: ${PUID:-1001}:${PGID:-1001}
    environment:
      TZ: ${TZ:-America/Toronto}
      UN_DEBUG: "false"
      UN_INTERVAL: 2m
      UN_START_DELAY: 1m
      UN_RETRY_DELAY: 5m
      UN_MAX_RETRIES: 3
      UN_PARALLEL: 1
      UN_FILE_MODE: "0664"
      UN_DIR_MODE: "0775"
      UN_SONARR_0_URL: http://sonarr:8989
      UN_SONARR_0_API_KEY: ${SONARR_API_KEY}
      UN_SONARR_0_PATHS_0: /complete/tv-sonarr
      UN_SONARR_0_PROTOCOLS: torrent
      UN_SONARR_0_TIMEOUT: 10s
      UN_SONARR_0_DELETE_ORIG: "false"
      UN_SONARR_0_DELETE_DELAY: 5m
      UN_RADARR_0_URL: http://radarr:7878
      UN_RADARR_0_API_KEY: ${RADARR_API_KEY}
      UN_RADARR_0_PATHS_0: /complete/radarr
      UN_RADARR_0_PROTOCOLS: torrent
      UN_RADARR_0_TIMEOUT: 10s
      UN_RADARR_0_DELETE_ORIG: "false"
      UN_RADARR_0_DELETE_DELAY: 5m
      UN_LIDARR_0_URL: http://lidarr:8686
      UN_LIDARR_0_API_KEY: ${LIDARR_API_KEY}
      UN_LIDARR_0_PATHS_0: /complete/lidarr
      UN_LIDARR_0_PROTOCOLS: torrent
      UN_LIDARR_0_TIMEOUT: 10s
      UN_LIDARR_0_DELETE_ORIG: "false"
      UN_LIDARR_0_DELETE_DELAY: 5m
      UN_FOLDER_0_PATH: /complete
      UN_FOLDER_0_DELETE_AFTER: 10m
      UN_FOLDER_0_DELETE_ORIGINAL: "false"
      UN_FOLDER_0_DELETE_FILES: "false"
      UN_FOLDER_0_MOVE_BACK: "false"
    security_opt:
      - no-new-privileges:true
    restart: always
    logging: *default-logging
    depends_on:
      - sonarr
      - radarr
      - lidarr
    networks:
      - download
    deploy:
      resources:
        limits:
          memory: 512M

  # seerr - media request management (web UI for friends/family)
  seerr:
    image: seerr/seerr:latest
    container_name: seerr
    environment:
      <<: *common-env
    volumes:
      - seerr_data:/app/config
    ports:
      - "5055:5055"
    restart: always
    logging: *default-logging
    depends_on:
      - sonarr
      - radarr
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5055/api/v1/status"]
      <<: *healthcheck-defaults
      start_period: 40s
    networks:
      - download
      - media
    deploy:
      resources:
        limits:
          memory: 512M

  # =============================================================================
  # MEDIA PROCESSING
  # =============================================================================

  # tdarr - automated media transcoding with NVIDIA CUDA
  tdarr:
    image: ghcr.io/haveagitgat/tdarr:latest
    container_name: tdarr
    #runtime: nvidia
    #deploy:
    #    resources:
    #        limits:
    #            memory: 4G
    #        reservations:
    #            devices:
    #                - driver: nvidia
    #                  count: all
    #                  capabilities: [compute, utility, video]
    environment:
      <<: *common-env
      serverIP: 0.0.0.0
      serverPort: 8266
      webUIPort: 8265
      internalNode: "true"
      inContainer: "true"
      ffmpegVersion: 6
      nodeName: Sullivan
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: all
    volumes:
      - tdarr_server_data:/app/server
      - tdarr_configs:/app/configs
      - /tmp/tdarr:/temp
      # MEDIA: Libraries to scan and transcode
      - ${MEDIA_PATH_MOVIES:-/mnt/media/movies}:/movies
      - ${MEDIA_PATH_SHOWS:-/mnt/media/shows}:/shows
      - ${MEDIA_PATH_MUSIC:-/mnt/media/music}:/music
      - ${MEDIA_PATH_MUSIC_VIDEOS:-/mnt/media/music_videos}:/music_videos
      - ${MEDIA_PATH_EDU:-/mnt/media/edu}:/edu
    ports:
      - "8265:8265"
      - "8266:8266"
    restart: always
    logging: *default-logging
    devices:
      - /dev/dri:/dev/dri
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8265"]
      <<: *healthcheck-defaults
      start_period: 60s
    networks:
      - media

  # recyclarr - sync TRaSH Guides quality profiles to Sonarr/Radarr
  # NOTE: recyclarr publishes no "latest" tag - pin to the major version
  recyclarr:
    image: ghcr.io/recyclarr/recyclarr:8
    container_name: recyclarr
    environment:
      TZ: ${TZ:-America/Toronto}
      RECYCLARR_CREATE_CONFIG: "true"
    volumes:
      - recyclarr_data:/config
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      - sonarr
      - radarr
    networks:
      - download
    deploy:
      resources:
        limits:
          memory: 256M

  # =============================================================================
  # UTILITY SERVICES
  # =============================================================================

  # filebot node
  filebot-node:
    container_name: filebot-node
    image: rednoah/filebot:node
    volumes:
      # DATA: Application data
      - filebot_data:/config
      # MEDIA: For organizing
      - ${MEDIA_PATH:-/mnt/media}:/media
      - ${MEDIA_PATH_CLEAN:-/mnt/media/clean}:/clean
      - ${MEDIA_PATH_MOVIES:-/mnt/media/movies}:/movies
      - ${MEDIA_PATH_SHOWS:-/mnt/media/shows}:/shows
      - ${MEDIA_PATH_MUSIC:-/mnt/media/music}:/music
      - ${DOWNLOAD_PATH_COMPLETE:-/mnt/media/qbittorrent/complete}:/complete
    ports:
      - "5452:5452"
    environment:
      <<: *common-env
      FILEBOT_NODE_AUTH: BASIC
      FILEBOT_NODE_AUTH_USER: ${FILEBOT_USER}
      FILEBOT_NODE_AUTH_PASS: ${FILEBOT_PASSWORD}
    restart: always
    logging: *default-logging
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5452"]
      <<: *healthcheck-defaults
      start_period: 40s
    networks:
      - utilities
      - download

  # youtube-dl
  ytdl_material:
    build:
      context: ./services/ytdl-material
      dockerfile: Dockerfile
    image: nuniesmith/sullivan:ytdl_material
    container_name: ytdl_material
    environment:
      ytdl_mongodb_connection_string: mongodb://ytdl-mongo-db:27017
      ytdl_use_local_db: "false"
      write_ytdl_config: "true"
    depends_on:
      ytdl-mongo-db:
        condition: service_healthy
    volumes:
      # DATA: Application data
      - ytdl_data:/app/appdata
      # MEDIA: Download directories
      - ${YOUTUBE_AUDIO_PATH:-/mnt/media/youtube/audio}:/app/audio
      - ${YOUTUBE_VIDEO_PATH:-/mnt/media/youtube/video}:/app/video
    ports:
      - "8998:17442"
    restart: always
    logging: *default-logging
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:17442"]
      <<: *healthcheck-defaults
      start_period: 60s
    networks:
      - utilities
      - database
    deploy:
      resources:
        limits:
          memory: 1G

  # duplicati
  duplicati:
    image: lscr.io/linuxserver/duplicati:latest
    container_name: duplicati
    environment:
      <<: *common-env
      SETTINGS_ENCRYPTION_KEY: ${DUPLICATI_ENCRYPTION_KEY}
    volumes:
      # DATA: Application data
      - duplicati_data:/config
      # BACKUP: Source and destination
      - ${BACKUP_DESTINATION:-/mnt/media/backup}:/backup
      - ${BACKUP_SOURCE:-/home/jordan/}:/source
    ports:
      - "8200:8200"
    restart: always
    logging: *default-logging
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8200"]
      <<: *healthcheck-defaults
      start_period: 40s
    networks:
      - utilities
    deploy:
      resources:
        limits:
          memory: 512M

  # mealie
  mealie:
    image: ghcr.io/mealie-recipes/mealie:latest
    container_name: mealie
    environment:
      <<: *common-env
      ALLOW_SIGNUP: "true"
      PGUSERDB: mealie
      PGPASSWORD: ${MEALIE_DB_PASSWORD}
      LDAP_AUTH_ENABLED: "false"
      MAX_WORKERS: 1
      WEB_CONCURRENCY: 1
      BASE_URL: ${MEALIE_BASE_URL:-http://localhost:9925}
    volumes:
      # DATA: Application data and recipes
      - mealie_data:/app/data
    ports:
      - "9925:9000"
    restart: always
    logging: *default-logging
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/api/app/about"]
      <<: *healthcheck-defaults
      start_period: 60s
    networks:
      - utilities
    deploy:
      resources:
        limits:
          memory: 512M

  # grocy
  grocy:
    image: lscr.io/linuxserver/grocy:latest
    container_name: grocy
    environment:
      <<: *common-env
    volumes:
      # DATA: Application data
      - grocy_data:/config
    ports:
      - "9283:80"
    restart: always
    logging: *default-logging
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      <<: *healthcheck-defaults
      start_period: 40s
    networks:
      - utilities
    deploy:
      resources:
        limits:
          memory: 256M

  # wiki.js - knowledge management and documentation
  wiki:
    image: ghcr.io/requarks/wiki:2
    container_name: wiki
    depends_on:
      wiki-postgres:
        condition: service_healthy
    environment:
      TZ: ${TZ:-America/Toronto}
      DB_TYPE: postgres
      DB_HOST: wiki-postgres
      DB_PORT: 5432
      DB_USER: ${WIKI_DB_USER:-wikijs}
      DB_PASS: ${WIKI_DB_PASSWORD}
      DB_NAME: ${WIKI_DB_NAME:-wiki}
    volumes:
      # DATA: Application data
      - wiki_data:/config
    ports:
      - "8090:3000"
    restart: always
    logging: *default-logging
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/healthz"]
      <<: *healthcheck-defaults
      start_period: 60s
    networks:
      - utilities
      - database
    deploy:
      resources:
        limits:
          memory: 512M

  # =============================================================================
  # DATABASE SERVICES
  # =============================================================================

  # ytdl-mongo-db
  ytdl-mongo-db:
    image: mongo:latest
    container_name: mongo-db
    logging:
      driver: "none"
    volumes:
      # DATA: MongoDB data files
      - ytdl_mongodb:/data/db
    restart: always
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.runCommand('ping').ok", "--quiet"]
      <<: *healthcheck-defaults
      start_period: 40s
    networks:
      - database
    deploy:
      resources:
        limits:
          memory: 512M

  # wiki-postgres - database for wiki.js
  wiki-postgres:
    image: postgres:15-alpine
    container_name: wiki-postgres
    environment:
      POSTGRES_DB: ${WIKI_DB_NAME:-wiki}
      POSTGRES_USER: ${WIKI_DB_USER:-wikijs}
      POSTGRES_PASSWORD: ${WIKI_DB_PASSWORD}
      TZ: ${TZ:-America/Toronto}
    volumes:
      # DATA: Database files
      - wiki_postgres:/var/lib/postgresql/data
    logging:
      driver: "none"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${WIKI_DB_USER:-wikijs}"]
      <<: *healthcheck-defaults
      start_period: 40s
    networks:
      - database
    deploy:
      resources:
        limits:
          memory: 512M

  dispatcharr:
    # build:
    #   context: .
    #   dockerfile: Dockerfile
    image: ghcr.io/dispatcharr/dispatcharr:latest
    restart: unless-stopped
    container_name: dispatcharr
    ports:
      - 9191:9191
    volumes:
      - dispatcharr_data:/data
    environment:
      - DISPATCHARR_ENV=aio
      - REDIS_HOST=localhost
      - CELERY_BROKER_URL=redis://localhost:6379/0
      - DISPATCHARR_LOG_LEVEL=info
      # Legacy CPU Support (Optional)
      # Uncomment to enable legacy NumPy build for older CPUs (circa 2009)
      # that lack support for newer baseline CPU features
      #- USE_LEGACY_NUMPY=true
      # Process Priority Configuration (Optional)
      # Lower values = higher priority. Range: -20 (highest) to 19 (lowest)
      # Negative values require cap_add: SYS_NICE (uncomment below)
      #- UWSGI_NICE_LEVEL=-5   # uWSGI/FFmpeg/Streaming (default: 0, recommended: -5 for high priority)
      #- CELERY_NICE_LEVEL=5   # Celery/EPG/Background tasks (default: 5, low priority)
    #
    # Uncomment to enable high priority for streaming (required if UWSGI_NICE_LEVEL < 0)
    #cap_add:
    #  - SYS_NICE
    # Optional for hardware acceleration
    #devices:
